import 'package:flutter/material.dart';
import 'package:speech_to_text/speech_to_text.dart' as stt;
import 'package:flutter_tts/flutter_tts.dart';
import 'package:http/http.dart' as http;
import 'dart:convert';

void main() {
  runApp(const PariApp());
}

class PariApp extends StatefulWidget {
  const PariApp({Key? key}) : super(key: key);

  @override
  State<PariApp> createState() => _PariAppState();
}

class _PariAppState extends State<PariApp> {
  Color primaryAccent = Colors.cyanAccent;
  Color bgGlassColor = Colors.black.withOpacity(0.85);
  bool isLiveWallpaperEnabled = true;

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: 'Pari Assistant',
      debugShowCheckedModeBanner: false,
      theme: ThemeData.dark().copyWith(
        scaffoldBackgroundColor: Colors.transparent,
        primaryColor: primaryAccent,
      ),
      home: PariHomeScreen(
        primaryAccent: primaryAccent,
        bgGlassColor: bgGlassColor,
        isLiveWallpaperEnabled: isLiveWallpaperEnabled,
        onChangeTheme: (Color newColor) {
          setState(() {
            primaryAccent = newColor;
          });
        },
      ),
    );
  }
}

class PariHomeScreen extends StatefulWidget {
  final Color primaryAccent;
  final Color bgGlassColor;
  final bool isLiveWallpaperEnabled;
  final Function(Color) onChangeTheme;

  const PariHomeScreen({
    Key? key,
    required this.primaryAccent,
    required this.bgGlassColor,
    required this.isLiveWallpaperEnabled,
    required this.onChangeTheme,
  }) : super(key: key);

  @override
  State<PariHomeScreen> createState() => _PariHomeScreenState();
}

class _PariHomeScreenState extends State<PariHomeScreen> with SingleTickerProviderStateMixin {
  late stt.SpeechToText _speech;
  late FlutterTts _tts;
  
  bool _isListening = false;
  bool _isThinking = false;
  String _userSpokenText = "Pari ko instruction dene ke liye Mic dabaayein...";
  String _pariResponseText = "Namaste! Main Pari hoon. Main aapki kya madad kar sakti hoon?";

  // 👉 YAHAN APNI APNI ASLI GOOGLE/GEMINI API KEY DAALEIN
  final String apiKey = "AQ.YAHAN_APNI_ASLI_API_KEY_DAALEIN";

  late AnimationController _waveController;

  @override
  void initState() {
    super.initState();
    _speech = stt.SpeechToText();
    _tts = FlutterTts();
    
    _waveController = AnimationController(
      vsync: this,
      duration: const Duration(seconds: 2),
    )..repeat(reverse: true);

    _initLanguageAndVoice();
  }

  void _initLanguageAndVoice() async {
    await _tts.setLanguage("hi-IN");
    await _tts.setPitch(1.1);
    await _tts.setSpeechRate(0.9);
  }

  void _listenVoice() async {
    if (!_isListening) {
      bool available = await _speech.initialize(
        onStatus: (val) => print('Speech Status: $val'),
        onError: (val) => print('Speech Error: $val'),
      );
      if (available) {
        setState(() => _isListening = true);
        _speech.listen(
          onResult: (val) => setState(() {
            _userSpokenText = val.recognizedWords;
            if (val.finalResult) {
              _isListening = false;
              _processPariBrain(_userSpokenText);
            }
          }),
        );
      }
    } else {
      setState(() => _isListening = false);
      _speech.stop();
    }
  }

  void _processPariBrain(String inputQuery) async {
    String query = inputQuery.toLowerCase();

    if (query.contains("wifi") || query.contains("वाईफाई")) {
      String response = "Ji! WiFi settings processing kar rahi hoon.";
      setState(() {
        _pariResponseText = response;
      });
      await _tts.speak(response);
    } else if (query.contains("kaun ho") || query.contains("naam kya hai")) {
      String response = "Mera naam Pari hai. Main aapki personal AI assistant hoon.";
      setState(() {
        _pariResponseText = response;
      });
      await _tts.speak(response);
    } else {
      await _getAIResponse(inputQuery);
    }
  }

  Future<void> _getAIResponse(String prompt) async {
    setState(() {
      _isThinking = true;
      _pariResponseText = "Pari is thinking...";
    });

    final url = Uri.parse(
        'https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent');

    try {
      final response = await http.post(
        url,
        headers: {
          'Content-Type': 'application/json',
          'X-goog-api-key': apiKey,
        },
        body: jsonEncode({
          "contents": [
            {
              "parts": [
                {
                  "text": "Your name is Pari, an intelligent AI assistant. " + prompt
                }
              ]
            }
          ]
        }),
      );

      if (response.statusCode == 200) {
        final data = jsonDecode(response.body);
        final aiText = data['candidates'][0]['content']['parts'][0]['text'];

        setState(() {
          _pariResponseText = aiText;
          _isThinking = false;
        });

        await _tts.speak(aiText);
      } else {
        setState(() {
          _pariResponseText = "Error connecting to AI server. Please check your API key.";
          _isThinking = false;
        });
        await _tts.speak("Error connecting to AI server.");
      }
    } catch (e) {
      setState(() {
        _pariResponseText = "Network error: Please check your internet connection.";
        _isThinking = false;
      });
      await _tts.speak("Network error.");
    }
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      body: Stack(
        children: [
          if (widget.isLiveWallpaperEnabled)
            Container(
              decoration: const BoxDecoration(
                gradient: LinearGradient(
                  colors: [Color(0xFF0F2027), Color(0xFF203A43), Color(0xFF2C5364)],
                  begin: Alignment.topLeft,
                  end: Alignment.bottomRight,
                ),
              ),
            ),
          Container(
            color: widget.bgGlassColor,
            child: SafeArea(
              child: Column(
                children: [
                  Padding(
                    padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 15),
                    child: Row(
                      mainAxisAlignment: MainAxisAlignment.spaceBetween,
                      children: [
                        Text(
                          'PARI AI',
                          style: TextStyle(
                            fontSize: 24,
                            fontWeight: FontWeight.bold,
                            color: widget.primaryAccent,
                            letterSpacing: 2.0,
                          ),
                        ),
                        IconButton(
                          icon: Icon(Icons.palette_outlined, color: widget.primaryAccent),
                          onPressed: () => _showThemePicker(context),
                        )
                      ],
                    ),
                  ),
                  const Spacer(),
                  ScaleTransition(
                    scale: Tween<double>(begin: 0.85, end: 1.15).animate(
                      CurvedAnimation(parent: _waveController, curve: Curves.easeInOut),
                    ),
                    child: Container(
                      width: 140,
                      height: 140,
                      decoration: BoxDecoration(
                        shape: BoxShape.circle,
                        color: widget.primaryAccent.withOpacity(0.2),
                        boxShadow: [
                          BoxShadow(
                            color: widget.primaryAccent.withOpacity(0.6),
                            blurRadius: 35,
                            spreadRadius: 10,
                          )
                        ],
                        border: Border.all(color: widget.primaryAccent, width: 2),
                      ),
                      child: Icon(
                        _isListening || _isThinking ? Icons.graphic_eq : Icons.bubble_chart,
                        size: 70,
                        color: widget.primaryAccent,
                      ),
                    ),
                  ),
                  const SizedBox(height: 30),
                  Padding(
                    padding: const EdgeInsets.symmetric(horizontal: 25.0),
                    child: Text(
                      _userSpokenText,
                      textAlign: TextAlign.center,
                      style: const TextStyle(fontSize: 16, color: Colors.white70),
                    ),
                  ),
                  const SizedBox(height: 15),
                  Container(
                    margin: const EdgeInsets.symmetric(horizontal: 20),
                    padding: const EdgeInsets.all(18),
                    decoration: BoxDecoration(
                      color: Colors.white.withOpacity(0.08),
                      borderRadius: BorderRadius.circular(15),
                      border: Border.all(color: widget.primaryAccent.withOpacity(0.3)),
                    ),
                    child: Text(
                      _pariResponseText,
                      textAlign: TextAlign.center,
                      style: TextStyle(
                        fontSize: 18,
                        color: widget.primaryAccent,
                        fontWeight: FontWeight.w500,
                      ),
                    ),
                  ),
                  const Spacer(),
                  GestureDetector(
                    onTap: _listenVoice,
                    child: Container(
                      padding: const EdgeInsets.all(22),
                      decoration: BoxDecoration(
                        shape: BoxShape.circle,
                        color: widget.primaryAccent,
                        boxShadow: [
                          BoxShadow(
                            color: widget.primaryAccent.withOpacity(0.4),
                            blurRadius: 20,
                            spreadRadius: 5,
                          )
                        ],
                      ),
                      child: Icon(
                        _isListening ? Icons.mic : Icons.mic_none,
                        size: 36,
                        color: Colors.black,
                      ),
                    ),
                  ),
                  const SizedBox(height: 35),
                ],
              ),
            ),
          ),
        ],
      ),
    );
  }

  void _showThemePicker(BuildContext context) {
    showModalBottomSheet(
      context: context,
      backgroundColor: Colors.grey[900],
      shape: const RoundedRectangleBorder(
        borderRadius: BorderRadius.vertical(top: Radius.circular(25)),
      ),
      builder: (context) {
        return Container(
          padding: const EdgeInsets.all(20),
          height: 180,
          child: Column(
            crossAxisAlignment: CrossAxisAlignment.start,
            children: [
              const Text(
                'Choose Pari Theme Accent Color',
                style: TextStyle(color: Colors.white, fontSize: 18, fontWeight: FontWeight.bold),
              ),
              const SizedBox(height: 20),
              Row(
                mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                children: [
                  _colorOption(Colors.cyanAccent),
                  _colorOption(Colors.purpleAccent),
                  _colorOption(Colors.greenAccent),
                  _colorOption(Colors.orangeAccent),
                  _colorOption(Colors.pinkAccent),
                ],
              ),
            ],
          ),
        );
      },
    );
  }

  Widget _colorOption(Color color) {
    return GestureDetector(
      onTap: () {
        widget.onChangeTheme(color);
        Navigator.pop(context);
      },
      child: CircleAvatar(
        backgroundColor: color,
        radius: 22,
      ),
    );
  }
}
